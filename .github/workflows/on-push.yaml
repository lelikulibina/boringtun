name: PR Status Checks

# `awg-2.0-extensions` alongside `master`: it is this fork's long-lived
# integration branch, and every PR so far has targeted it rather than master.
# With only `master` listed, none of the jobs below had ever run against that
# work -- 47 commits, with only Semgrep and the review bot for company. A
# `pull_request` entry filters on the *base* branch, so this covers the
# short-lived branches that merge into it too.
on:
  workflow_dispatch:
  push:
    branches: [ "master", "awg-2.0-extensions", "awg-*" ]
  pull_request:
    branches: [ "master", "awg-2.0-extensions", "awg-*" ]

jobs:
  # Depends on all actions that are required for a "successful" CI run.
  # Based on the ci here: https://github.com/tokio-rs/tokio/blob/master/.github/workflows/ci.yml
  all-systems-go:
    runs-on: ubuntu-latest
    needs:
      - check_features
      - clippy
      - rustfmt
      - tests
      - integration-tests
      - test-windows
      - awg-go-interop
    steps:
      - run: exit 0

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Check Windows
        run: cargo check -p boringtun

      - name: Test Windows
        run: cargo test -p boringtun

  check_features:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check --each-feature

  clippy:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack clippy --each-feature

  rustfmt:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: cargo fmt --all --check

  tests:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack test --each-feature

  integration-tests:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: cargo test -- --ignored

  # Cross-implementation test against the exact official AWG 3.1 reference.
  # The current harness verifies handshake, ICMP, TCP and UDP in one role.
  # Reverse-role interoperability remains outstanding.
  awg-go-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'

      - name: Install network test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping python3-cryptography

      - name: Build BoringTun
        run: cargo build --release -p boringtun-cli

      - name: Build pinned AmneziaWG reference
        run: |
          git clone --depth 1 --branch v3.1.20260828 https://github.com/amnezia-vpn/amneziawg-go.git /tmp/amneziawg-go
          cd /tmp/amneziawg-go
          go build -o /tmp/amneziawg-go-bin .

      - name: Run cross-implementation handshake and ICMP/TCP/UDP tests
        run: sudo bash scripts/awg-go-interop.sh "$GITHUB_WORKSPACE/target/release/boringtun-cli" /tmp/amneziawg-go-bin
